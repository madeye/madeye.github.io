<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Max Lv — Open Source Projects</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-card: #f6f8fa;
    --text: #1f2328;
    --text-secondary: #656d76;
    --border: #d0d7de;
    --link: #0969da;
    --star: #e3b341;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --bg-card: #161b22;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --border: #30363d;
      --link: #58a6ff;
      --star: #e3b341;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    padding: 2rem 1rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Profile */
  .profile {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
  }
  .profile img {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    border: 2px solid var(--border);
  }
  .profile-info h1 { font-size: 1.5rem; }
  .profile-info .bio { color: var(--text-secondary); margin: 0.25rem 0; }
  .profile-meta {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.875rem;
    color: var(--text-secondary);
  }
  .profile-meta span::before { margin-right: 0.25rem; }

  /* Repos */
  .repos-heading {
    font-size: 1.125rem;
    margin-bottom: 1rem;
    color: var(--text-secondary);
  }
  .repos {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 1rem;
  }
  .repo-card {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    transition: border-color 0.15s;
  }
  .repo-card:hover { border-color: var(--link); }
  .repo-card h3 { font-size: 1rem; font-weight: 600; }
  .repo-card .desc {
    font-size: 0.875rem;
    color: var(--text-secondary);
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .repo-meta {
    display: flex;
    gap: 1rem;
    font-size: 0.75rem;
    color: var(--text-secondary);
    align-items: center;
    flex-wrap: wrap;
  }
  .lang-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 0.25rem;
    vertical-align: middle;
  }

  .loading, .error {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
  }
  .error { color: #d1242f; }

  @media (max-width: 480px) {
    .repos { grid-template-columns: 1fr; }
    .profile { gap: 1rem; }
    .profile img { width: 64px; height: 64px; }
  }
</style>
</head>
<body>

<section id="profile" class="profile">
  <div class="loading">Loading profile...</div>
</section>

<h2 class="repos-heading" id="repos-heading" style="display:none">Open Source Projects</h2>
<section id="repos" class="repos">
  <div class="loading">Loading projects...</div>
</section>

<script>
const LANG_COLORS = {
  C: "#555555",
  "C++": "#f34b7d",
  "C#": "#178600",
  CSS: "#563d7c",
  Dart: "#00B4AB",
  Go: "#00ADD8",
  HTML: "#e34c26",
  Java: "#b07219",
  JavaScript: "#f1e05a",
  Kotlin: "#A97BFF",
  Lua: "#000080",
  "Objective-C": "#438eff",
  Python: "#3572A5",
  Ruby: "#701516",
  Rust: "#dea584",
  Shell: "#89e051",
  Swift: "#F05138",
  TypeScript: "#3178c6",
  Vim: "#199f4b",
  Makefile: "#427819",
};

function timeAgo(dateStr) {
  const diff = Date.now() - new Date(dateStr).getTime();
  const days = Math.floor(diff / 86400000);
  if (days < 1) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return days + " days ago";
  const months = Math.floor(days / 30);
  if (months < 12) return months + (months === 1 ? " month ago" : " months ago");
  const years = Math.floor(days / 365);
  return years + (years === 1 ? " year ago" : " years ago");
}

function escapeHtml(str) {
  if (!str) return "";
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadProfile() {
  const el = document.getElementById("profile");
  try {
    const u = await fetchJSON("https://api.github.com/users/madeye");
    el.innerHTML = `
      <a href="${u.html_url}"><img src="${u.avatar_url}" alt="${escapeHtml(u.name || u.login)}"></a>
      <div class="profile-info">
        <h1>${escapeHtml(u.name || u.login)}</h1>
        ${u.bio ? `<p class="bio">${escapeHtml(u.bio)}</p>` : ""}
        <div class="profile-meta">
          ${u.company ? `<span>${escapeHtml(u.company)}</span>` : ""}
          ${u.location ? `<span>${escapeHtml(u.location)}</span>` : ""}
          ${u.blog ? `<span><a href="${u.blog.startsWith("http") ? u.blog : "https://" + u.blog}">${escapeHtml(u.blog)}</a></span>` : ""}
          <span><a href="${u.html_url}">@${escapeHtml(u.login)}</a></span>
        </div>
      </div>`;
  } catch {
    el.innerHTML = `<div class="error">Could not load profile. <a href="https://github.com/madeye">Visit GitHub profile</a></div>`;
  }
}

async function loadRepos() {
  const el = document.getElementById("repos");
  const heading = document.getElementById("repos-heading");
  try {
    const [personal, ssLibev, ssAndroid, ssOrg] = await Promise.all([
      fetchJSON("https://api.github.com/users/madeye/repos?per_page=100"),
      fetchJSON("https://api.github.com/repos/shadowsocks/shadowsocks-libev"),
      fetchJSON("https://api.github.com/repos/shadowsocks/shadowsocks-android"),
      fetchJSON("https://api.github.com/repos/shadowsocks/shadowsocks-org"),
    ]);

    const nonForks = personal.filter(r => !r.fork);
    const all = [...nonForks, ssLibev, ssAndroid, ssOrg];

    // Deduplicate by full_name (prefer shadowsocks org version)
    const seen = new Map();
    for (const r of all) {
      const key = r.name.toLowerCase();
      const existing = seen.get(key);
      if (!existing || r.stargazers_count > existing.stargazers_count) {
        seen.set(key, r);
      }
    }

    const repos = [...seen.values()].sort(
      (a, b) => new Date(b.updated_at) - new Date(a.updated_at)
    );

    heading.style.display = "";
    el.innerHTML = repos.map(r => {
      const langColor = LANG_COLORS[r.language] || "#8b949e";
      return `<a href="${r.html_url}" class="repo-card" style="text-decoration:none;color:inherit">
        <h3>${escapeHtml(r.full_name)}</h3>
        ${r.description ? `<p class="desc">${escapeHtml(r.description)}</p>` : `<p class="desc" style="opacity:0.5">No description</p>`}
        <div class="repo-meta">
          ${r.language ? `<span><span class="lang-dot" style="background:${langColor}"></span>${escapeHtml(r.language)}</span>` : ""}
          <span>${r.stargazers_count.toLocaleString()} stars</span>
          <span>Updated ${timeAgo(r.updated_at)}</span>
        </div>
      </a>`;
    }).join("");
  } catch {
    heading.style.display = "";
    el.innerHTML = `<div class="error">Could not load repositories (GitHub API rate limit may have been reached).<br><a href="https://github.com/madeye?tab=repositories">Browse repos on GitHub</a></div>`;
  }
}

loadProfile();
loadRepos();
</script>

</body>
</html>
